name: Build AppImage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  appimage:
    name: Build SimpleShell AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            gir1.2-gtk-4.0 \
            libgdk-pixbuf2.0-bin \
            libgtk-4-1 \
            libtiff5 \
            python3 \
            python3-gi \
            wget

      - name: Build
        run: make clean all

      - name: Run tests
        run: make test

      - name: Prepare AppDir
        run: |
          set -eux

          APPDIR="$PWD/AppDir"
          PYTHON_VERSION="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          MULTIARCH="$(gcc -print-multiarch)"

          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/lib"
          mkdir -p "$APPDIR/usr/lib/$MULTIARCH"
          mkdir -p "$APPDIR/usr/lib/$MULTIARCH/gdk-pixbuf-2.0"
          mkdir -p "$APPDIR/usr/lib/girepository-1.0"
          mkdir -p "$APPDIR/usr/lib/python3/dist-packages"
          mkdir -p "$APPDIR/usr/share/glib-2.0"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/scalable/apps"

          install -m 0755 bin/SimpleShell "$APPDIR/usr/bin/SimpleShell"
          install -m 0755 ui/simpleshell_gtk4.py "$APPDIR/usr/bin/simpleshell_gtk4.py"
          install -m 0755 "$(command -v python3)" "$APPDIR/usr/bin/python3"

          cp -a "/usr/lib/python$PYTHON_VERSION" "$APPDIR/usr/lib/"
          cp -a /usr/lib/python3/dist-packages/gi "$APPDIR/usr/lib/python3/dist-packages/"
          cp -a /usr/lib/python3/dist-packages/pygtkcompat "$APPDIR/usr/lib/python3/dist-packages/" || true
          cp -a /usr/lib/python3/dist-packages/*.egg-info "$APPDIR/usr/lib/python3/dist-packages/" || true
          cp -a /usr/lib/$MULTIARCH/girepository-1.0/*.typelib "$APPDIR/usr/lib/girepository-1.0/"
          cp -a /usr/lib/$MULTIARCH/gdk-pixbuf-2.0/* "$APPDIR/usr/lib/$MULTIARCH/gdk-pixbuf-2.0/"
          cp -a /usr/share/glib-2.0/schemas "$APPDIR/usr/share/glib-2.0/"

          copy_deps() {
            local target="$1"
            ldd "$target" 2>/dev/null | awk '{ for (i = 1; i <= NF; i++) if (index($i, "/") == 1) print $i }' | while read -r dep; do
              if [[ -f "$dep" ]]; then
                mkdir -p "$APPDIR$(dirname "$dep")"
                cp -Ln "$dep" "$APPDIR$dep"
              fi
            done
          }

          copy_all_deps() {
            local before=0
            local after=0
            while true; do
              before="$(find "$APPDIR" -type f | wc -l)"
              while IFS= read -r file; do
                copy_deps "$file"
              done < <(find "$APPDIR" -type f \( -perm -0100 -o -name '*.so' -o -name '*.so.*' \))
              after="$(find "$APPDIR" -type f | wc -l)"
              if [[ "$before" == "$after" ]]; then
                break
              fi
            done
          }

          copy_deps "$(command -v python3)"
          copy_deps "$APPDIR/usr/bin/SimpleShell"
          for library in \
            /usr/lib/python3/dist-packages/gi/_gi*.so \
            /usr/lib/$MULTIARCH/libgtk-4.so.* \
            /usr/lib/$MULTIARCH/libgdk_pixbuf-2.0.so.* \
            /usr/lib/$MULTIARCH/libpango-1.0.so.* \
            /usr/lib/$MULTIARCH/libpangocairo-1.0.so.* \
            /usr/lib/$MULTIARCH/libharfbuzz.so.* \
            /usr/lib/$MULTIARCH/libcairo.so.* \
            /usr/lib/$MULTIARCH/libgraphene-1.0.so.* \
            /usr/lib/$MULTIARCH/libgirepository-1.0.so.* \
            /usr/lib/$MULTIARCH/libtiff.so.*; do
            if [[ -e "$library" ]]; then
              mkdir -p "$APPDIR$(dirname "$library")"
              cp -Ln "$library" "$APPDIR$library"
              copy_deps "$library"
            fi
          done

          copy_all_deps

          GDK_PIXBUF_QUERY_LOADERS="$(command -v gdk-pixbuf-query-loaders || true)"
          if [[ -z "$GDK_PIXBUF_QUERY_LOADERS" ]]; then
            GDK_PIXBUF_QUERY_LOADERS="$(find /usr/lib -path '*/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders' -type f | head -n 1)"
          fi
          if [[ -z "$GDK_PIXBUF_QUERY_LOADERS" ]]; then
            echo "gdk-pixbuf-query-loaders not found" >&2
            exit 1
          fi

          GDK_PIXBUF_MODULEDIR="$APPDIR/usr/lib/$MULTIARCH/gdk-pixbuf-2.0/2.10.0/loaders" \
            GDK_PIXBUF_MODULE_FILE="$APPDIR/usr/lib/$MULTIARCH/gdk-pixbuf-2.0/2.10.0/loaders.cache" \
            "$GDK_PIXBUF_QUERY_LOADERS" > "$APPDIR/usr/lib/$MULTIARCH/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          sed -i "s#$APPDIR##g" "$APPDIR/usr/lib/$MULTIARCH/gdk-pixbuf-2.0/2.10.0/loaders.cache"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "$0")")"
          PYTHON_LIB_DIR="$(find "$HERE/usr/lib" -maxdepth 1 -type d -name 'python3.*' | head -n 1)"
          BUNDLED_LD_PATH="$HERE/usr/lib"
          for dir in "$HERE"/usr/lib/*; do
            if [[ -d "$dir" ]]; then
              BUNDLED_LD_PATH="$BUNDLED_LD_PATH:$dir"
            fi
          done
          MULTIARCH_DIR="$(find "$HERE/usr/lib" -mindepth 1 -maxdepth 1 -type d -name '*-linux-gnu' | head -n 1)"
          export PATH="$HERE/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$BUNDLED_LD_PATH:${LD_LIBRARY_PATH:-}"
          export PYTHONHOME="$HERE/usr"
          export PYTHONPATH="$PYTHON_LIB_DIR:$PYTHON_LIB_DIR/lib-dynload:$HERE/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          export GI_TYPELIB_PATH="$HERE/usr/lib/girepository-1.0:${GI_TYPELIB_PATH:-}"
          export GSETTINGS_SCHEMA_DIR="$HERE/usr/share/glib-2.0/schemas"
          if [[ -n "$MULTIARCH_DIR" ]]; then
            export GDK_PIXBUF_MODULEDIR="$MULTIARCH_DIR/gdk-pixbuf-2.0/2.10.0/loaders"
            export GDK_PIXBUF_MODULE_FILE="$MULTIARCH_DIR/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          fi
          exec "$HERE/usr/bin/python3" "$HERE/usr/bin/simpleshell_gtk4.py" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/simpleshell.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=SimpleShell UI
          Comment=GTK4 graphical interface for SimpleShell
          Exec=simpleshell
          Icon=simpleshell
          Terminal=false
          Categories=Utility;System;Development;
          EOF
          cp "$APPDIR/simpleshell.desktop" "$APPDIR/usr/share/applications/simpleshell.desktop"

          cat > "$APPDIR/simpleshell.svg" <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
            <rect width="128" height="128" rx="24" fill="#1e1e1e"/>
            <path d="M24 38l24 26-24 26" fill="none" stroke="#66bb6a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M58 90h46" fill="none" stroke="#d4d4d4" stroke-width="10" stroke-linecap="round"/>
          </svg>
          EOF
          cp "$APPDIR/simpleshell.svg" "$APPDIR/.DirIcon"
          cp "$APPDIR/simpleshell.svg" "$APPDIR/usr/share/icons/hicolor/scalable/apps/simpleshell.svg"

      - name: Download appimagetool
        run: |
          wget -O appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./appimagetool-x86_64.AppImage AppDir SimpleShell-x86_64.AppImage
          chmod +x SimpleShell-x86_64.AppImage
          file SimpleShell-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleShell-x86_64.AppImage
          path: SimpleShell-x86_64.AppImage
          if-no-files-found: error
